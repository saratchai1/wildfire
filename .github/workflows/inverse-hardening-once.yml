name: Apply scoped inverse source hardening once
on:
  push:
    branches: [feature/inverse-source-v1]
    paths: [scripts/harden_inverse_once.py]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/inverse-source-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python scripts/harden_inverse_once.py
          node --check inverse-ui.js
          node --test tests/*.test.cjs
          rm scripts/harden_inverse_once.py .github/workflows/inverse-hardening-once.yml
          git config user.name 'wildfire-build-bot'
          git config user.email 'wildfire-build-bot@users.noreply.github.com'
          git add inverse-engine.js inverse-ui.js tests/inverse-edge.test.cjs scripts/harden_inverse_once.py .github/workflows/inverse-hardening-once.yml
          git commit -m 'fix: require fresh sustained evidence and guard pending observation results'
          git push origin HEAD:feature/inverse-source-v1
