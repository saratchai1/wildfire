name: Validate and deploy roadside pilot
on:
  workflow_dispatch:
  push:
    branches: [main, design/roadside-2km-v2]
    paths-ignore: ['qa/**', 'README.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wildfire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and legacy plus v2 geospatial and model tests
        run: |
          for f in core.js app.js siting.js siting-ui.js history.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          node scripts/assess_roadside_v2.cjs
      - name: Build committed static application versions
        run: node scripts/build.cjs
      - name: Install browser test runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser proof for preserved v1 and nine-station v2
        run: |
          python -m http.server 4173 --directory site >/tmp/wildfire-http.log 2>&1 &
          python tests/browser.py
          python tests/history_browser.py
          python tests/siting_browser.py
      - name: Record QA on development branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/roadside-2km-v2'
        run: |
          git config user.name 'wildfire-qa-bot'
          git config user.email 'wildfire-qa-bot@users.noreply.github.com'
          git add qa/
          git diff --cached --quiet && exit 0
          git commit -m 'test: record complete v1 and v2 regression evidence [skip ci]'
          git push origin HEAD:design/roadside-2km-v2
      - name: Portable application
        run: cd site && zip -qr ../wildfire-roadside-pilot.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildfire-qa-and-portable-app
          path: |
            artifacts/
            qa/
            wildfire-roadside-pilot.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated nine-station application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live page and exact version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,pathlib
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          expected=os.environ['EXPECTED_SHA']
          last=None
          for attempt in range(18):
              try:
                  url=base+'version.json?rev='+expected+'&attempt='+str(attempt)
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Wildfire-Pages-Verification'})
                  with urllib.request.urlopen(request,timeout=15) as r:
                      version=json.load(r)
                  assert version['sourceCommit']==expected,version
                  assert version['planVersion']=='roadside-2km-v2' and version['stationCount']==9,version
                  with urllib.request.urlopen(base+'?rev='+expected,timeout=15) as r:
                      html=r.read().decode('utf-8')
                  assert 'analysis-controls' in html and 'siting-ui.js' in html
                  proof={'status':'PASS','pageUrl':base,'httpStatus':200,'version':version,'verifiedAtUnix':time.time()}
                  pathlib.Path('live-proof.json').write_text(json.dumps(proof,indent=2))
                  print(json.dumps(proof,indent=2))
                  break
              except Exception as error:
                  last=error
                  if attempt==17:raise RuntimeError('Live version verification failed: '+str(last))
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wildfire-live-deployment-proof
          path: live-proof.json
