name: Validate and deploy roadside pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['qa/**', 'README.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wildfire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pure/geospatial integrity tests
        run: |
          node --check core.js
          node --check app.js
          node --check history.js
          node --test tests/*.test.cjs
      - name: Build static portable application
        run: node scripts/build.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser workflows with external maps deliberately unavailable
        run: |
          python -m http.server 4173 --directory site >/tmp/wildfire-http.log 2>&1 &
          python tests/browser.py
          python tests/history_browser.py
      - name: Portable offline-capable application
        run: |
          cd site
          zip -qr ../wildfire-roadside-pilot.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildfire-qa-and-portable-app
          path: |
            artifacts/
            qa/
            wildfire-roadside-pilot.zip
      - name: Record successful browser proof in repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'wildfire-qa-bot'
          git config user.email 'wildfire-qa-bot@users.noreply.github.com'
          git add qa/
          git diff --cached --quiet && exit 0
          git commit -m 'test: record browser proof and desktop/mobile previews [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (first enablement may need owner Settings)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
