name: Validate and deploy roadside pilot
on:
  workflow_dispatch:
  push:
    branches: [main, design/roadside-2km-v2, feature/operator-explainer-v3, feature/north-station-n1, feature/inverse-source-v1, fix/inverse-review-integrity, feature/bayesian-source-v2a]
    paths-ignore: ['qa/**', 'README.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wildfire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact source under review
        run: |
          git archive --format=zip --output=wildfire-source.zip HEAD
          mkdir -p qa
          git rev-parse HEAD > qa/validated-source-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and all observation/model/geospatial regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in core.js app.js siting.js siting-ui.js history.js console-model.js console-map.js console.js inverse-engine.js inverse-simulator.js inverse-worker.js inverse-ui.js bayes-engine.js bayes-worker.js bayes-panel.js v2a-simulator.js terrain-physics.js terrain-inverse.js terrain-worker.js terrain-ui.js calibration.js; do node --check "$f"; done
          node --test tests/*.test.cjs | tee qa/unit-tests.tap
          node scripts/assess_roadside_v2.cjs > /tmp/roadside-screening.log
      - name: Publish all fixed V2A benchmark cases including misses
        run: node scripts/benchmark_v2a.cjs > qa/v2a-benchmark.log
      - name: Evaluate experimental terrain cases without promotion
        run: node scripts/benchmark_terrain.cjs > qa/v2b-benchmark.log
      - name: Build committed static applications
        run: node scripts/build.cjs
      - name: Install browser test runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser proof for preserved tools and blind inverse application
        run: |
          python -m http.server 4173 --directory site >/tmp/wildfire-http.log 2>&1 &
          python tests/browser.py
          python tests/history_browser.py
          python tests/siting_browser.py
          python tests/legacy_console_regression.py
          python tests/inverse_browser.py
          python tests/review_browser.py
          python tests/bayes_browser.py
          python tests/terrain_browser.py
      - name: Require immutable application sources
        if: always()
        run: |
          git diff --exit-code -- . ':!qa/**'
          git diff --cached --exit-code -- . ':!qa/**'
      - name: Portable application
        run: cd site && zip -qr ../wildfire-roadside-pilot.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildfire-qa-and-portable-app
          path: |
            artifacts/
            qa/
            wildfire-source.zip
            wildfire-roadside-pilot.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated inverse application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live inverse app, asset hashes and exact N1 version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,pathlib,hashlib
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          expected=os.environ['EXPECTED_SHA']
          def get(file):
              request=urllib.request.Request(base+file+'?rev='+expected,headers={'Cache-Control':'no-cache','User-Agent':'Wildfire-Pages-Verification'})
              with urllib.request.urlopen(request,timeout=20) as r:
                  assert r.status==200
                  return r.read()
          for attempt in range(18):
              try:
                  version=json.loads(get('version.json'))
                  assert version['sourceCommit']==expected and version['appVersion']=='inverse-source-v2a',version
                  assert version['planVersion']=='roadside-2km-v3-north' and version['stationCount']==10,version
                  assert version['modelVersion']=='inverse-footprint-v1.1-evidence',version
                  assert version['challengerVersion']=='bayes-grid-v2a.1' and version['defaultAlgorithm']=='baseline',version
                  assert version['primaryViews']==['dashboard','principles'] and version['fieldValidated'] is False
                  assert version['experimentalTerrain']['version']=='terrain-inverse-v2b.0' and version['experimentalTerrain']['promoted'] is False
                  for file,digest in version['assets'].items():
                      assert hashlib.sha256(get(file)).hexdigest()==digest,file
                  html=get('index.html').decode('utf-8')
                  assert 'nav-dashboard' in html and 'nav-principles' in html and 'inverse-ui.js' in html
                  plan=json.loads(get('data/plan-v2.json'));assert len(plan['stations'])==10
                  north=next(s for s in plan['stations'] if s['id']=='R10')
                  assert abs(north['lat']-(18+49/60+53.6/3600))<1e-9
                  assert abs(north['lon']-(98+51/60+38.5/3600))<1e-9 and north['gateway'] is None
                  for file in ['forward.html','planning.html','v1.html']:assert len(get(file))>100
                  proof={'status':'PASS','pageUrl':base,'httpStatus':200,'version':version,'verifiedAtUnix':time.time()}
                  pathlib.Path('live-proof.json').write_text(json.dumps(proof,indent=2));print(json.dumps(proof,indent=2));break
              except Exception as error:
                  if attempt==17:raise RuntimeError('Live verification failed: '+str(error))
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wildfire-live-deployment-proof
          path: live-proof.json
